apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gharchalo.fullname" . }}-db
  labels:
    {{- include "gharchalo.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "gharchalo.databaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- if and (not .Values.api.sarvam.existingSecret) .Values.api.sarvam.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gharchalo.sarvamSecretName" . }}
  labels:
    {{- include "gharchalo.labels" . | nindent 4 }}
type: Opaque
stringData:
  SARVAM_API_KEY: {{ .Values.api.sarvam.apiKey | quote }}
{{- end }}
