{{- $name := printf "%s-api" (include "gharchalo.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "gharchalo.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "gharchalo.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gharchalo.selector" (list . "api") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gharchalo.fullname" . }}-db
                  key: DATABASE_URL
            - name: DB_POOL_SIZE
              value: {{ .Values.api.dbPool.size | quote }}
            - name: DB_MAX_OVERFLOW
              value: {{ .Values.api.dbPool.maxOverflow | quote }}
            - name: DB_POOL_TIMEOUT_SECONDS
              value: {{ .Values.api.dbPool.timeoutSeconds | quote }}
            - name: SARVAM_CHAT_MODEL
              value: {{ .Values.api.sarvam.chatModel | quote }}
            - name: SARVAM_STT_MODEL
              value: {{ .Values.api.sarvam.sttModel | quote }}
            - name: SARVAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gharchalo.sarvamSecretName" . }}
                  key: SARVAM_API_KEY
                  optional: true   # without a key, typed search still works
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "gharchalo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gharchalo.selector" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
