{{- if .Values.seed.enabled }}
# Runs after install/upgrade. --if-empty makes it a no-op once data exists;
# --wait covers Postgres still starting.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gharchalo.fullname" . }}-seed
  labels:
    {{- include "gharchalo.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "gharchalo.selector" (list . "seed") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: seed
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "seed.py", "--if-empty", "--wait", {{ .Values.seed.waitSeconds | quote }}]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gharchalo.fullname" . }}-db
                  key: DATABASE_URL
{{- end }}
