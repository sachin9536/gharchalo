# Local images by default (built with `docker compose build` or deploy/k8s-up.sh).
api:
  image:
    repository: gharchalo-api
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # Incident knob: 128Mi reproduces the OOMKilled incident; 512Mi is the fix.
      memory: 512Mi
  # Incident knob: size 2 / maxOverflow 0 reproduces DB pool exhaustion (503s).
  dbPool:
    size: 10
    maxOverflow: 10
    timeoutSeconds: 10
  sarvam:
    # Prefer existingSecret (a Secret with key SARVAM_API_KEY); apiKey is for quick local use.
    existingSecret: ""
    apiKey: ""
    chatModel: sarvam-105b
    sttModel: "saaras:v3"
  # PEM text of your network's root CA when a corporate proxy re-signs HTTPS (see
  # deploy/trust-corporate-ca.sh). deploy/k8s-up.sh passes certs/corp-ca.pem automatically.
  caBundle: ""
  # Incident knob (Page 5 Incident 2 / NudgeBee rollback demo):
  # Setting enabled=true rolls out a faulty release that returns 500 on SBC <-> HYB.
  expressSurgePricing:
    enabled: false
  # Extra env vars, e.g. [{name: SARVAM_TIMEOUT_SECONDS, value: "60"}]
  extraEnv: []

web:
  image:
    repository: gharchalo-web
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP   # NodePort works too (set nodePort)
    port: 80
    nodePort: null

postgres:
  enabled: true
  image: postgres:16
  user: gharchalo
  password: gharchalo   # demo only
  database: gharchalo
  persistence:
    enabled: false      # emptyDir: data is reseeded on a fresh pod
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Used only when postgres.enabled=false.
externalDatabaseUrl: ""

seed:
  enabled: true
  waitSeconds: 180
  backoffLimit: 6

# Continuous artificial load generator (k6) in the same namespace.
# Always sends X-Load-Test: 1 so /voice hits the stub and NEVER consumes Sarvam quota.
# Crank vus up (e.g. --set loadgen.vus=30 --set loadgen.sleepMs=50) to trigger TatkalStorm.
loadgen:
  enabled: true
  image: grafana/k6:0.54.0
  replicas: 1
  vus: 5
  sleepMs: 500
  urgentRatio: "0.2"
  heavyRatio: "0.25"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
